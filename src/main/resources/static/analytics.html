<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Analytics Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Segoe UI, Arial, sans-serif;
            background:#f4f7fc;
        }

        .navbar{
            background:#1565c0;
            color:white;
            padding:20px 40px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            box-shadow:0 2px 8px rgba(0,0,0,0.2);
        }

        .nav-title{
            font-size:28px;
            font-weight:bold;
        }

        .dashboard-btn{
            background:white;
            color:#1565c0;
            border:none;
            padding:10px 20px;
            border-radius:8px;
            font-size:15px;
            font-weight:bold;
            cursor:pointer;
        }

        .dashboard-btn:hover{
            background:#f0f0f0;
        }

        .container{
            max-width:1000px;
            margin:30px auto;
            padding:20px;
        }

        .stats{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:20px;
            margin-bottom:25px;
        }

        .stat-card{
            background:white;
            text-align:center;
            padding:20px;
            border-radius:12px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        .stat-number{
            font-size:36px;
            font-weight:bold;
            color:#1565c0;
            margin-bottom:10px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:12px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
            margin-bottom:20px;
        }

        .card h2{
            margin-bottom:15px;
            color:#333;
        }

        .chart-container{
            height:180px;
            width:100%;
        }

        @media(max-width:768px){

            .stats{
                grid-template-columns:1fr;
            }

            .navbar{
                flex-direction:column;
                gap:10px;
            }
        }

    </style>
</head>

<body>

<div class="navbar">

    <div class="nav-title">
        Analytics Dashboard
    </div>

    <button class="dashboard-btn"
            onclick="window.location.href='index.html'">
        Dashboard
    </button>

</div>

<div class="container">

    <div class="stats">

        <div class="stat-card">
            <div class="stat-number" id="highCount">0</div>
            <div>High Priority</div>
        </div>

        <div class="stat-card">
            <div class="stat-number" id="mediumCount">0</div>
            <div>Medium Priority</div>
        </div>

        <div class="stat-card">
            <div class="stat-number" id="lowCount">0</div>
            <div>Low Priority</div>
        </div>

    </div>

    <div class="card">

        <h2>Cases By Priority</h2>

        <div class="chart-container">
            <canvas id="priorityChart"></canvas>
        </div>

    </div>

    <div class="card">

        <h2>Cases By Sentiment</h2>

        <div class="chart-container">
            <canvas id="sentimentChart"></canvas>
        </div>

    </div>

    <div class="card">

        <h2>Cases By Status</h2>

        <div class="chart-container">
            <canvas id="statusChart"></canvas>
        </div>

    </div>

    <div class="card">

        <h2>Agent Workload</h2>

        <div class="chart-container">
            <canvas id="agentChart"></canvas>
        </div>

    </div>

</div>

<script>

async function loadAnalytics() {

    const response =
        await fetch("/analytics");

    const data =
        await response.json();

    document.getElementById("highCount").innerText =
        data.highPriority;

    document.getElementById("mediumCount").innerText =
        data.mediumPriority;

    document.getElementById("lowCount").innerText =
        data.lowPriority;

    new Chart(
        document.getElementById("priorityChart"),
        {
            type: "bar",
            data: {
                labels: ["High", "Medium", "Low"],
                datasets: [{
                    label: "Cases",
                    data: [
                        data.highPriority,
                        data.mediumPriority,
                        data.lowPriority
                    ],
                    backgroundColor: [
                        "#e53935",
                        "#fb8c00",
                        "#43a047"
                    ]
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        }
    );

    new Chart(
        document.getElementById("sentimentChart"),
        {
            type: "pie",
            data: {
                labels: [
                    "Negative",
                    "Neutral",
                    "Positive"
                ],
                datasets: [{
                    data: [
                        data.negativeSentiment,
                        data.neutralSentiment,
                        data.positiveSentiment
                    ],
                    backgroundColor: [
                        "#e53935",
                        "#fbc02d",
                        "#43a047"
                    ]
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        }
    );

    new Chart(
        document.getElementById("statusChart"),
        {
            type: "doughnut",
            data: {
                labels: [
                    "Open",
                    "In Progress",
                    "Resolved",
                    "Closed"
                ],
                datasets: [{
                    data: [
                        data.openCases,
                        data.inProgressCases,
                        data.resolvedCases,
                        data.closedCases
                    ],
                    backgroundColor: [
                        "#1976d2",
                        "#fb8c00",
                        "#43a047",
                        "#616161"
                    ]
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        }
    );

    new Chart(
        document.getElementById("agentChart"),
        {
            type: "bar",
            data: {
                labels: [
                    "Sathwika",
                    "Arjun",
                    "Support Team",
                    "Unassigned"
                ],
                datasets: [{
                    label: "Cases",
                    data: [
                        data.sathwikaCases,
                        data.arjunCases,
                        data.supportTeamCases,
                        data.unassignedCases
                    ],
                    backgroundColor: [
                        "#1565c0",
                        "#43a047",
                        "#fb8c00",
                        "#757575"
                    ]
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        }
    );
}

loadAnalytics();

</script>

</body>
</html>
